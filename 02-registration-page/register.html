<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | SimpleSchedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">

    <div class="brand">
      <span class="logo">S</span>
      <span>SimpleSchedule</span>
    </div>

    <section class="auth-card">
      <p class="eyebrow">Create your workspace</p>
      <h1>Create an account</h1>
      <p class="subtitle">Start sharing your appointment page in minutes.</p>

      <form class="auth-form" id="register-form">
        <!-- New field compared to the sign in page -->
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Alex Smith" required>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="alex@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>

        <button type="submit" class="primary-btn wide">Create account</button>
      </form>

      <!-- Link back to the sign in page (index.html) -->
      <p class="switch-text">Already have an account? <a href="index.html">Sign in</a></p>
    </section>

    <p class="demo-note">CS 219 student project demo</p>
  </main>
</body>
</html>
