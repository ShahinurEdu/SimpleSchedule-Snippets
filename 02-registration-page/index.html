<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | SimpleSchedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">

    <!-- 1. Logo -->
    <div class="brand">
      <span class="logo">S</span>
      <span>SimpleSchedule</span>
    </div>

    <!-- 2. The white card -->
    <section class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to your account</h1>
      <p class="subtitle">Manage your appointments and availability.</p>

      <!-- 3. The form -->
      <form class="auth-form" id="login-form">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="alex@example.com" required>

        <div class="label-row">
          <label for="password">Password</label>
          <a href="#">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>

        <button type="submit" class="primary-btn wide">Sign in</button>
      </form>

      <!-- 4. Link to the Create account page (we build it in Step 2) -->
      <p class="switch-text">Don't have an account? <a href="register.html">Create one</a></p>
    </section>

    <p class="demo-note">CS 219 student project demo</p>
  </main>
</body>
</html>
